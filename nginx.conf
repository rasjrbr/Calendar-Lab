user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Add ICS mime type
    types {
        text/calendar ics;
    }

    server {
        listen 80;
        server_name _;
        
        # Serve calendars
        location /calendars/ {
            alias /var/www/calendars/;
            
            # ICS files should be served as text/calendar
            add_header Content-Type "text/calendar; charset=utf-8";
            add_header Content-Disposition "inline";
            
            # Allow access from anywhere (no CORS restrictions needed for webcal)
            add_header Access-Control-Allow-Origin "*";
            
            # Enable directory listing (optional, for debugging)
            autoindex on;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
        
        # Root
        location / {
            root /var/www;
            index index.html;
        }
    }
}
